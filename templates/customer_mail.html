<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Ergouzi Mailbox</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #2a2622;
      --muted: #6f6657;
      --subtle: #9a9183;
      --line: #e7ddcb;
      --line-strong: #dccfb8;
      --panel: #fbf8f1;
      --canvas: #f2ede4;
      --brand: #c0563a;
      --brand-hover: #cb6a4f;
      --brand-dark: #9c4530;
      --selected: rgba(192, 86, 58, .10);
      --panel-muted: #f4eee3;
      --warm: #b87514;
      --danger: #c0392b;
      --good: #2f8f6b;
      --font-sans: Inter, "Noto Sans SC", ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Source Serif 4", "Noto Serif SC", Georgia, serif;
      --shadow-sm: 0 2px 12px rgba(120, 72, 40, .08);
      font-family: var(--font-sans);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--canvas); overflow: hidden; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }

    .app-shell { height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      flex: 0 0 auto; padding: 0 24px;
      background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .topbar-inner {
      width: min(1480px, 100%); margin: 0 auto; overflow: hidden;
      background: transparent;
    }
    .title-row {
      min-height: 74px; display: flex; align-items: center;
      padding: 16px 0; color: var(--ink); background: transparent;
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-mark {
      width: 40px; height: 40px; display: grid; place-items: center;
      border-radius: 12px; background: var(--selected); color: var(--brand);
      border: 1px solid var(--line); font-size: 18px;
    }
    .brand-title {
      font-family: var(--font-display); color: var(--ink);
      font-size: 20px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap;
    }
    .brand-subtitle { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .connection-row { padding: 0 0 18px; background: transparent; }
    .connection-form {
      min-width: 0; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(220px, .8fr) auto 44px;
      align-items: center; gap: 12px;
    }
    .connection-field { min-width: 0; }
    .connection-field .text-input { height: 44px; }
    .topbar-actions { display: contents; }
    .account-pill {
      display: none;
    }
    .icon-button, .primary-button {
      height: 44px; border: 1px solid var(--line-strong); border-radius: 12px;
      background: var(--panel); color: var(--ink); padding: 0 14px;
    }
    .icon-button { width: 44px; padding: 0; font-size: 17px; line-height: 1; }
    .primary-button { border-color: var(--brand); background: var(--brand); color: #fff; font-weight: 700; box-shadow: 0 6px 18px var(--selected); }
    .icon-button:hover { border-color: var(--brand); color: var(--brand); background: var(--selected); }
    .primary-button:hover { border-color: var(--brand-hover); background: var(--brand-hover); }
    button:disabled { opacity: .55; cursor: wait; }

    .workspace {
      width: min(1480px, calc(100% - 48px)); margin: 0 auto; padding: 20px 0 24px;
      display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr);
      gap: 16px; flex: 1; min-height: 0;
    }
    .panel {
      min-width: 0; min-height: 0; display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: var(--shadow-sm); overflow: hidden;
    }

    .mail-panel { min-height: 0; }
    .mail-folders {
      min-width: 0; padding: 18px 16px 14px; border-bottom: 1px solid var(--line);
      background: var(--panel-muted);
    }
    .mail-list-section { min-height: 0; flex: 1; display: flex; flex-direction: column; }
    .field-label {
      display: block; color: var(--muted); font-size: 12px; font-weight: 700; margin-bottom: 7px;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      color: var(--brand); font-size: 14px; pointer-events: none;
    }
    .text-input {
      width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 12px;
      padding: 0 13px 0 34px; color: var(--ink); background: var(--panel-muted); outline: none;
    }
    .text-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--selected); }
    .text-input::placeholder { color: var(--subtle); }
    .text-input:-webkit-autofill {
      -webkit-text-fill-color: var(--ink);
      -webkit-box-shadow: 0 0 0 1000px var(--panel-muted) inset;
    }
    .security-note {
      color: var(--muted); font-size: 12px; line-height: 1.5; padding: 10px 11px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--panel-muted);
    }
    .folder-heading {
      display: flex; align-items: center; justify-content: space-between;
      color: var(--subtle); font-size: 11px; font-weight: 750; margin: 1px 8px 10px;
    }
    .folder-list { display: grid; gap: 4px; }
    .folder-button {
      width: 100%; height: 42px; display: flex; align-items: center; gap: 10px;
      border: 1px solid transparent; border-left: 3px solid transparent; border-radius: 12px; padding: 0 10px 0 8px; text-align: left;
      background: transparent; color: var(--muted);
    }
    .folder-button:hover { background: var(--selected); color: var(--ink); }
    .folder-button[aria-selected="true"] { border-color: var(--line-strong); border-left-color: var(--brand); background: var(--selected); color: var(--brand); font-weight: 750; }
    .folder-icon { width: 18px; height: 18px; display: grid; place-items: center; color: currentColor; }
    .folder-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .folder-count { margin-left: auto; color: var(--subtle); font-size: 11px; font-variant-numeric: tabular-nums; }

    .panel-heading {
      min-height: 64px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--line);
    }
    .panel-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--ink); }
    .panel-caption { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .status { min-height: 24px; padding: 8px 20px 0; color: var(--muted); font-size: 12px; }
    .status.error { color: var(--danger); }
    .message-list { min-height: 0; flex: 1; overflow: auto; background: var(--panel); }
    .message-row {
      width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px;
      padding: 14px 18px; border: 0; border-left: 3px solid transparent;
      border-bottom: 1px solid var(--line); background: var(--panel);
      text-align: left; transition: background .12s ease, border-color .12s ease;
    }
    .message-row:hover { background: var(--panel-muted); }
    .message-row[aria-selected="true"] { border-left-color: var(--brand); background: var(--selected); }
    .message-subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .message-from, .message-preview {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--muted); font-size: 12px; margin-top: 6px;
    }
    .message-preview { color: #52636c; margin-top: 5px; }
    .message-date { color: var(--subtle); font-size: 11px; white-space: nowrap; }
    .empty {
      height: 100%; min-height: 220px; display: grid; place-items: start center;
      padding: 82px 24px 24px; color: var(--muted); font-size: 13px; text-align: center;
      background: var(--panel);
    }
    .empty-inner, .detail-empty-inner {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      max-width: 260px;
    }
    .empty-icon, .detail-empty-icon {
      width: 46px; height: 46px; display: grid; place-items: center;
      border-radius: 12px; background: var(--selected); color: var(--brand);
      font-size: 21px; margin-bottom: 3px;
    }
    .empty-title {
      font-family: var(--font-display); color: var(--ink); font-size: 14px; font-weight: 700;
    }
    .empty-description {
      color: var(--muted); font-size: 12px; line-height: 1.5;
    }

    .detail { background: var(--panel); }
    .detail-body { min-height: 0; flex: 1; overflow: auto; padding: 26px 28px; }
    .detail-empty { height: 100%; display: grid; place-items: start center; padding-top: 150px; color: var(--muted); font-size: 13px; text-align: center; background: var(--panel); }
    .detail-empty-inner { max-width: 300px; }
    .detail-empty-icon { width: 52px; height: 52px; font-size: 23px; }
    .detail-empty-title { font-family: var(--font-display); color: var(--ink); font-size: 15px; font-weight: 700; }
    .detail-empty-description { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .detail-subject { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 1.35; letter-spacing: 0; }
    .detail-meta { display: flex; flex-wrap: wrap; gap: 7px 18px; color: var(--muted); font-size: 12px; margin-top: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .detail-content { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); font-size: 14px; line-height: 1.75; margin-top: 20px; }
    .detail-footer { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 22px; }

    @media (max-width: 860px) {
      body { overflow: auto; }
      .app-shell { min-height: 100vh; height: auto; }
      .workspace { width: min(100% - 24px, 1480px); }
    }
    @media (max-width: 700px) {
      .topbar { padding: 12px 12px 0; }
      .title-row { min-height: 58px; padding: 11px 14px; }
      .connection-row { padding: 11px 14px 13px; }
      .connection-form { display: flex; flex-wrap: wrap; }
      .connection-field { flex: 1 1 220px; }
      .connection-form .primary-button,
      .connection-form .icon-button { flex: 0 0 auto; }
      .workspace { display: flex; flex-direction: column; width: calc(100% - 24px); padding: 12px 0 16px; gap: 12px; }
      .mail-panel { display: flex; flex-direction: column; }
      .mail-folders { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 10px 10px; }
      .folder-list { grid-template-columns: repeat(2, 1fr); }
      .folder-button { justify-content: center; padding: 0 4px; }
      .folder-count { display: none; }
      .message-list { max-height: 390px; }
      .detail { min-height: 380px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="title-row">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">▣</div>
            <div>
              <div class="brand-title">Ergouzi Mailbox</div>
              <div class="brand-subtitle">客户邮件查询</div>
            </div>
          </div>
        </div>
        <div class="connection-row">
          <div class="connection-form" aria-label="邮箱连接">
            <div class="connection-field">
              <label class="sr-only" for="email">邮箱地址</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">▣</span>
                <input id="email" class="text-input" type="email" autocomplete="email" maxlength="254" placeholder="邮箱地址" required>
              </div>
            </div>
            <div class="connection-field secret-field">
              <label class="sr-only" for="secret">客户密钥</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">⚿</span>
                <input id="secret" class="text-input" type="password" autocomplete="off" maxlength="256" placeholder="客户密钥" required>
              </div>
            </div>
            <button id="submit" class="primary-button" type="button">连接邮箱</button>
            <button id="refresh-button" class="icon-button" type="button" title="刷新邮件" aria-label="刷新邮件">↻</button>
          </div>
        </div>
        <span id="account-pill" class="account-pill" aria-hidden="true"></span>
      </div>
    </header>

    <main class="workspace">
      <section class="panel mail-panel">
        <div class="mail-folders">
          <div class="folder-heading"><span>文件夹</span><span id="message-count">0 封</span></div>
          <div class="folder-list" role="tablist" aria-label="邮件文件夹">
            <button class="folder-button" type="button" data-view="all" role="tab" aria-selected="true">
              <span class="folder-icon">▤</span><span>全部邮件</span><span class="folder-count" data-count="all">—</span>
            </button>
            <button class="folder-button" type="button" data-view="junk" role="tab" aria-selected="false">
              <span class="folder-icon">⌁</span><span>垃圾邮件</span><span class="folder-count" data-count="junk">—</span>
            </button>
          </div>
        </div>
        <div class="mail-list-section">
          <div class="panel-heading">
            <div>
              <div class="panel-title">邮件</div>
              <div class="panel-caption" id="list-caption">输入邮箱和客户密钥开始查询</div>
            </div>
            <span class="panel-caption" id="list-title">全部邮件 · 最多 50 封</span>
          </div>
          <div id="status" class="status" role="status" aria-live="polite"></div>
          <div id="messages" class="message-list"></div>
        </div>
      </section>

      <section class="panel detail">
        <div class="panel-heading">
          <div>
            <div class="panel-title">邮件详情</div>
            <div class="panel-caption">选择左侧邮件查看内容</div>
          </div>
        </div>
        <div id="detail" class="detail-body">
          <div class="detail-empty">查询邮件后，选择一封邮件查看详情</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const formFields = {
      email: document.getElementById('email'),
      secret: document.getElementById('secret'),
    };
    const list = document.getElementById('messages');
    const detail = document.getElementById('detail');
    const status = document.getElementById('status');
    const submit = document.getElementById('submit');
    const refresh = document.getElementById('refresh-button');
    const accountPill = document.getElementById('account-pill');
    const messageCount = document.getElementById('message-count');
    const listTitle = document.getElementById('list-title');
    const listCaption = document.getElementById('list-caption');
    const views = { all: '全部邮件', junk: '垃圾邮件' };
    let view = 'all';
    let messages = [];
    let selectedIndex = -1;
    let controller;
    let detailController;
    let credentials;

    function clean(value) {
      return String(value || '').trim();
    }

    function formatDate(value) {
      if (!value) return '未知时间';
      const parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return value;
      return parsed.toLocaleString('zh-CN', { dateStyle: 'medium', timeStyle: 'short' });
    }

    function emptyDetail(message = '查询邮件后，选择一封邮件查看详情') {
      detail.setAttribute('aria-busy', 'false');
      detail.innerHTML = `
        <div class="detail-empty">
          <div class="detail-empty-inner">
            <div class="detail-empty-icon" aria-hidden="true">✉</div>
            <div class="detail-empty-title">邮件详情</div>
            <div class="detail-empty-description"></div>
          </div>
        </div>
      `;
      detail.querySelector('.detail-empty-description').textContent = message;
    }

    function renderDetail(message = messages[selectedIndex], notice = '正在读取完整正文...') {
      if (!message) {
        emptyDetail();
        return;
      }
      detail.replaceChildren();
      const subject = document.createElement('h1');
      subject.className = 'detail-subject';
      subject.textContent = clean(message.subject) || '无主题';
      const meta = document.createElement('div');
      meta.className = 'detail-meta';
      const from = document.createElement('span');
      from.textContent = `发件人：${clean(message.from) || '未知发件人'}`;
      const date = document.createElement('span');
      date.textContent = formatDate(message.date);
      meta.append(from, date);
      for (const [field, label] of [['to', '收件人'], ['cc', '抄送']]) {
        if (!message[field]) continue;
        const item = document.createElement('span');
        item.textContent = `${label}：${message[field]}`;
        meta.append(item);
      }
      detail.append(subject, meta);
      const body = document.createElement('div');
      body.className = 'detail-content';
      body.textContent = typeof message.body === 'string' ? (message.body || '这封邮件没有正文。') : notice;
      const footer = document.createElement('div');
      footer.className = 'detail-footer';
      footer.textContent = '邮件内容仅在当前页面展示，不会保存到浏览器本地。';
      detail.append(body, footer);
    }

    function cancelDetail() {
      if (detailController) detailController.abort();
      detailController = null;
      detail.setAttribute('aria-busy', 'false');
    }

    async function loadDetail() {
      cancelDetail();
      const selected = messages[selectedIndex];
      if (!selected || !credentials) return;
      if (!selected.message_id) {
        renderDetail(selected, '暂时无法读取详情，请刷新邮件列表');
        return;
      }
      const active = new AbortController();
      detailController = active;
      renderDetail(selected);
      detail.setAttribute('aria-busy', 'true');
      try {
        const response = await fetch('/api/customer/messages/detail', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...credentials, message_id: selected.message_id }),
          cache: 'no-store',
          signal: active.signal,
        });
        const result = await response.json();
        if (detailController !== active || messages[selectedIndex] !== selected) return;
        if (!response.ok || !result.success || typeof result.message?.body !== 'string') {
          throw new Error(typeof result.message === 'string' ? result.message : '暂时无法读取邮件详情');
        }
        renderDetail(result.message);
      } catch (error) {
        if (error.name === 'AbortError' || detailController !== active) return;
        renderDetail(selected, error instanceof SyntaxError ? '暂时无法读取邮件详情' : (error.message || '读取详情失败'));
        const retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'primary-button';
        retry.textContent = '重新读取';
        retry.addEventListener('click', loadDetail);
        detail.append(retry);
      } finally {
        if (detailController === active) {
          detailController = null;
          detail.setAttribute('aria-busy', 'false');
        }
      }
    }

    function renderMessages() {
      list.replaceChildren();
      messageCount.textContent = `${messages.length} 封`;
      document.querySelector(`[data-count="${view}"]`).textContent = messages.length;
      if (!messages.length) {
        cancelDetail();
        const connected = formFields.email.value.trim() && formFields.secret.value;
        list.innerHTML = `
          <div class="empty">
            <div class="empty-inner">
              <div class="empty-icon" aria-hidden="true">✉</div>
              <div class="empty-title">${connected ? '当前文件夹没有邮件' : '先连接一个邮箱'}</div>
              <div class="empty-description">${connected ? '切换其他文件夹，或稍后刷新再试' : '输入邮箱地址和客户密钥后，邮件会显示在这里'}</div>
            </div>
          </div>
        `;
        renderDetail();
        return;
      }
      if (selectedIndex < 0 || selectedIndex >= messages.length) selectedIndex = 0;
      messages.forEach((message, index) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'message-row';
        row.setAttribute('aria-selected', String(index === selectedIndex));
        const content = document.createElement('div');
        const subject = document.createElement('div');
        subject.className = 'message-subject';
        subject.textContent = clean(message.subject) || '无主题';
        const sender = document.createElement('div');
        sender.className = 'message-from';
        sender.textContent = clean(message.from) || '未知发件人';
        const preview = document.createElement('div');
        preview.className = 'message-preview';
        preview.textContent = clean(message.preview) || '无正文摘要';
        content.append(subject, sender, preview);
        const date = document.createElement('div');
        date.className = 'message-date';
        date.textContent = formatDate(message.date);
        row.append(content, date);
        row.addEventListener('click', () => {
          selectedIndex = index;
          renderMessages();
        });
        list.append(row);
      });
      loadDetail();
    }

    async function query() {
      if (controller) controller.abort();
      controller = null;
      cancelDetail();
      credentials = null;
      messages = [];
      selectedIndex = -1;
      renderMessages();
      const email = formFields.email.value.trim();
      const secret = formFields.secret.value;
      if (!email || !secret) {
        status.textContent = '请填写邮箱地址和客户密钥';
        status.className = 'status error';
        submit.disabled = false;
        refresh.disabled = false;
        return;
      }
      const active = new AbortController();
      controller = active;
      list.replaceChildren();
      emptyDetail('正在读取最新邮件...');
      status.className = 'status';
      status.textContent = '正在读取邮件...';
      submit.disabled = true;
      refresh.disabled = true;
      accountPill.textContent = email;
      listTitle.textContent = `${views[view]} · 最多 50 封`;
      listCaption.textContent = '正在同步最新邮件';
      try {
        const response = await fetch('/api/customer/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, secret, view }),
          cache: 'no-store',
          signal: active.signal,
        });
        const result = await response.json();
        if (controller !== active) return;
        if (!response.ok || !result.success) throw new Error(result.message || '查询失败');
        credentials = { email, secret };
        messages = Array.isArray(result.messages) ? result.messages : [];
        selectedIndex = messages.length ? 0 : -1;
        status.className = 'status';
        status.textContent = messages.length ? '' : '当前文件夹没有邮件';
        listCaption.textContent = `最近邮件 · ${formatDate(new Date().toISOString())}`;
        renderMessages();
      } catch (error) {
        if (error.name === 'AbortError' || controller !== active) return;
        messages = [];
        selectedIndex = -1;
        list.replaceChildren();
        emptyDetail('暂时无法显示邮件，请检查邮箱和客户密钥');
        status.className = 'status error';
        status.textContent = error.message || '查询失败';
        listCaption.textContent = '请检查邮箱和客户密钥';
      } finally {
        if (controller === active) {
          controller = null;
          submit.disabled = false;
          refresh.disabled = false;
        }
      }
    }

    function selectView(nextView) {
      view = nextView;
      document.querySelectorAll('[data-view]').forEach(button => {
        button.setAttribute('aria-selected', String(button.dataset.view === view));
      });
      listTitle.textContent = `${views[view]} · 最多 50 封`;
      if (formFields.email.value.trim() && formFields.secret.value) query();
      else {
        messages = [];
        selectedIndex = -1;
        renderMessages();
        listCaption.textContent = '输入邮箱和客户密钥开始查询';
      }
    }

    submit.addEventListener('click', query);
    refresh.addEventListener('click', query);
    for (const field of Object.values(formFields)) {
      field.addEventListener('input', () => {
        if (controller) controller.abort();
        controller = null;
        cancelDetail();
        credentials = null;
        messages = [];
        selectedIndex = -1;
        accountPill.textContent = '';
        status.textContent = '';
        listCaption.textContent = '输入邮箱和客户密钥开始查询';
        submit.disabled = false;
        refresh.disabled = false;
        document.querySelectorAll('[data-count]').forEach(count => { count.textContent = '—'; });
        renderMessages();
      });
    }
    formFields.secret.addEventListener('keydown', event => {
      if (event.key === 'Enter') query();
    });
    document.querySelectorAll('[data-view]').forEach(button => {
      button.addEventListener('click', () => selectView(button.dataset.view));
    });
    renderMessages();
  </script>
</body>
</html>
